name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # openal-soft 1.14 asks for cmake 2.4, which cmake 4 refuses
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool cmake \
            libx11-dev libxext-dev libgl-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libsdl2-dev

      - name: Install build tools (macos)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool gnu-sed pkgconf sdl2
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> $GITHUB_PATH

      - name: Clone forsaken-libs
        id: libs
        run: |
          git clone --depth 1 https://github.com/ForsakenX/forsaken-libs.git libs
          echo "rev=$(git -C libs rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ matrix.os }}-${{ steps.libs.outputs.rev }}

      - name: Build forsaken-libs
        run: ./libs/src/build.sh

      - name: Build SDL=1 GL=1
        run: ./libs/make.sh -j4 ${{ runner.os == 'macOS' && 'PROFILE=0' || '' }}

      - name: Build SDL=2 GL=3 (SDL2 from the system)
        run: make clean && ./libs/make.sh -j4 SDL=2 GL=3 ${{ runner.os == 'macOS' && 'PROFILE=0' || '' }}
