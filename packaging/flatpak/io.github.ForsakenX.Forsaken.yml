# Flatpak manifest for ForsakenX.
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.ForsakenX.Forsaken.yml
#   flatpak run io.github.ForsakenX.Forsaken
#
# The game is built against SDL2 + OpenGL 1 with LuaJIT (Lua 5.1 API),
# luasocket 3 and enet 1.3.  Game data comes from ForsakenX/forsaken-data.
# Pilots, configs and saved games live in
# ~/.var/app/io.github.ForsakenX.Forsaken/data/forsaken

app-id: io.github.ForsakenX.Forsaken
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: forsaken
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all          # gpu + joysticks
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man

modules:
  - name: luajit
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} PREFIX=/app
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        commit: ea9eb7edb5eac4a9d175d74523db34fac0fa5180  # v2.1
    cleanup:
      - /bin

  # luasocket ships only loadable lua modules; the game links socket.core
  # and mime.core in directly, so also archive the objects into a static
  # library and describe it with a pkg-config file named after the lua
  # package (the Makefile asks for $(LUA)-socket).
  - name: luasocket
    buildsystem: simple
    build-commands:
      - make -C src linux LUAV=5.1 LUAINC_linux=/app/include/luajit-2.1
      - make -C src install PLAT=linux LUAV=5.1 prefix=/app
      - >-
        ar rcs /app/lib/libluasocket.a
        src/luasocket.o src/timeout.o src/buffer.o src/io.o src/auxiliar.o
        src/compat.o src/options.o src/inet.o src/usocket.o src/except.o
        src/select.o src/tcp.o src/udp.o src/mime.o
      - install -Dm644 luajit-socket.pc /app/lib/pkgconfig/luajit-socket.pc
    sources:
      - type: git
        url: https://github.com/lunarmodules/luasocket.git
        tag: v3.1.0
        commit: 95b7efa9da506ef968c1347edf3fc56370f0deed
      - type: inline
        dest-filename: luajit-socket.pc
        contents: |
          prefix=/app
          libdir=${prefix}/lib
          Name: luajit-socket
          Description: LuaSocket core and mime modules as a static library
          Version: 3.1.0
          Requires: luajit
          Libs: -L${libdir} -lluasocket

  - name: enet
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/lsalzman/enet.git
        tag: v1.3.18
        commit: 2662c0de09e36f2a2030ccc2c528a3e4c9e8138a
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -fi

  - name: forsaken-data
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/forsaken/data
      - cp -r bgobjects levels models offsets sound textures txt /app/share/forsaken/data/
      - install -Dm644 LICENSE /app/share/licenses/forsaken-data/LICENSE
    sources:
      - type: git
        url: https://github.com/ForsakenX/forsaken-data.git
        commit: 52ed2ef1c79f80753af376a50c790dcca19ef7f1

  - name: forsaken
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} SDL=2 GL=1 LUA=luajit PROFILE=0
      - install -Dm755 projectx /app/bin/projectx
      - mkdir -p /app/share/forsaken
      - cp -r scripts /app/share/forsaken/
      - install -Dm755 packaging/flatpak/forsaken.sh /app/bin/forsaken
      - install -Dm644 packaging/flatpak/io.github.ForsakenX.Forsaken.desktop /app/share/applications/io.github.ForsakenX.Forsaken.desktop
      - install -Dm644 packaging/flatpak/io.github.ForsakenX.Forsaken.metainfo.xml /app/share/metainfo/io.github.ForsakenX.Forsaken.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.ForsakenX.Forsaken.png /app/share/icons/hicolor/128x128/apps/io.github.ForsakenX.Forsaken.png
      - install -Dm644 LICENSE /app/share/licenses/forsaken/LICENSE
    sources:
      - type: dir
        path: ../..
